name: Fortnite Cup Ankuendigungen

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fortnite Cups pruefen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python main.py

      - name: Gesendete Cups speichern
        run: |
          if [ -f sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git diff --cached --quiet || (git commit -m "Gesendete Cups aktualisieren" && git push)
          fi
